name: Flohmaerkte pruefen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read
  issues: write

jobs:
  dateien-pruefen:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien von GitHub laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python-Version anzeigen
        run: python --version

      - name: Unsere vier Dateien pruefen
        run: |
          python - <<'PY'
          from pathlib import Path

          dateien = [
              "maerkte_berlin.py",
              "json_erstellen.py",
              "berliner_flohmaerkte.csv",
              "maerkte_berlin.json",
          ]

          for datei in dateien:
              if not Path(datei).is_file():
                  raise SystemExit(f"FEHLT: {datei}")
              print(f"OK: {datei}")

          print("Alle vier Dateien sind vorhanden!")
          PY

      - name: Python-Programme auf Syntax pruefen
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for datei in ["maerkte_berlin.py", "json_erstellen.py"]:
              ast.parse(Path(datei).read_text(encoding="utf-8-sig"))
              print(f"Syntax OK: {datei}")
          PY

      - name: Online nach Flohmarkt-Aenderungen suchen
        run: |
          set -o pipefail
          python maerkte_berlin.py | tee online-pruefung.log

      - name: Alle Flohmarkt-Sicherheitspruefungen ausfuehren
        run: |
          python json_erstellen.py

      - name: Erstellte JSON-Datei kontrollieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          datei = Path("maerkte_berlin.json")

          with datei.open(encoding="utf-8") as f:
              daten = json.load(f)

          assert daten["anzahl"] == 26, (
              "Die Anzahl der Flohmaerkte stimmt nicht!"
          )

          assert len(daten["maerkte"]) == 26, (
              "Es fehlen Flohmaerkte in der JSON-Datei!"
          )

          print("OK: JSON-Datei ist lesbar")
          print("OK: 26 Flohmaerkte vorhanden")
          print("Alle GitHub-Pruefungen bestanden!")
          PY

      - name: Aenderungen als GitHub-Hinweis melden
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const protokoll = fs.readFileSync('online-pruefung.log', 'utf8');
            const zeilen = protokoll.split(/\r?\n/);
            const meldungen = zeilen.filter(zeile =>
              zeile.startsWith('NEU:') ||
              zeile.startsWith('GEÄNDERT:') ||
              zeile.startsWith('NICHT MEHR GEFUNDEN')
            );

            if (meldungen.length === 0) {
              core.info('Keine Aenderungen zu melden.');
              return;
            }

            const fingerprint = crypto.createHash('sha256')
              .update([...meldungen].sort().join('\n'))
              .digest('hex').slice(0, 12);
            const titel = `Flohmarkt-Aenderungen pruefen (${fingerprint})`;
            const { owner, repo } = context.repo;
            const vorhandene = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });

            if (vorhandene.some(issue => issue.title === titel)) {
              core.info('Diese Aenderungen wurden bereits gemeldet.');
              return;
            }

            const inhalt = [
              'Die automatische Online-Pruefung hat folgende Unterschiede gefunden:',
              '',
              ...meldungen.map(zeile => `- ${zeile}`),
              '',
              '**Wichtig:** Dies sind nur Hinweise, keine bestaetigten Termine oder Absagen.',
              'Bitte die offiziellen Quellen pruefen, bevor Daten freigegeben werden.',
              '',
              `Prueflauf: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner, repo, title: titel, body: inhalt
            });
            core.info(`Pruefhinweis erstellt: ${issue.data.html_url}`);
