
name: Flohmaerkte pruefen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dateien-pruefen:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien von GitHub laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python-Version anzeigen
        run: python --version

      - name: Unsere vier Dateien pruefen
        run: |
          python - <<'PY'
          from pathlib import Path

          dateien = [
              "maerkte_berlin.py",
              "json_erstellen.py",
              "berliner_flohmaerkte.csv",
              "maerkte_berlin.json",
          ]

          for datei in dateien:
              if not Path(datei).is_file():
                  raise SystemExit(f"FEHLT: {datei}")
              print(f"OK: {datei}")

          print("Alle vier Dateien sind vorhanden!")
          PY

      - name: Python-Programme auf Syntax pruefen
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for datei in ["maerkte_berlin.py", "json_erstellen.py"]:
              ast.parse(Path(datei).read_text(encoding="utf-8-sig"))
              print(f"Syntax OK: {datei}")
          PY
